# ============================================
# 代码路径映射 (Code Path Mapping)
# AI系统可通过代码路径直接定位文档
# ============================================

code_path_mappings:
  # 基础设施层 (Infrastructure Layer)
  "infra/parser/":
    doc: "modules/infra/parser.md"
    description: "SQL解析器，将SQL文本转换为AST"
    key_classes: ["SQLParserEngine", "SQLStatement", "Lexer"]

  "infra/route/":
    doc: "modules/infra/route.md"
    description: "路由引擎基础设施，路由策略和算法"
    key_classes: ["RouteEngine", "RouteResult", "RouteContext"]

  "infra/rewrite/":
    doc: "modules/infra/rewrite.md"
    description: "SQL重写基础设施，Token和Segment重写"
    key_classes: ["SQLRewriteContext", "TokenRewriter", "SegmentRewriter"]

  "infra/executor/":
    doc: "modules/infra/executor.md"
    description: "执行引擎基础设施，并行和串行执行"
    key_classes: ["ExecuteEngine", "ExecutionContext", "ExecuteResult"]

  "infra/merge/":
    doc: "modules/infra/merge.md"
    description: "结果合并引擎，流式和内存合并"
    key_classes: ["MergeEngine", "MergedResult", "MergeUnit"]

  "infra/spi/":
    doc: "modules/infra/spi.md"
    description: "SPI加载机制，扩展点管理"
    key_classes: ["TypedSPILoader", "DatabaseTypedSPILoader"]

  "infra/expr/":
    doc: "modules/infra/expr.md"
    description: "表达式引擎，SQL表达式求值"
    key_classes: ["ExpressionEngine"]

  # 核心内核层 (Kernel Layer)
  "kernel/metadata/":
    doc: "modules/kernel/metadata.md"
    description: "元数据管理，表结构、规则、数据源元数据"
    key_classes: ["ShardingSphereMetaData", "RuleMetaData", "TableMetaData"]

  "kernel/transaction/":
    doc: "modules/kernel/transaction.md"
    description: "事务管理，分布式事务和本地事务"
    key_classes: ["TransactionManager", "TransactionContext"]

  "kernel/session/":
    doc: "modules/kernel/session.md"
    description: "会话管理，连接状态和上下文"
    key_classes: ["SessionManager", "Session"]

  "kernel/authority/":
    doc: "modules/kernel/authority.md"
    description: "权限管理，用户认证和授权"
    key_classes: ["AuthorityManager"]

  # 特性功能层 (Feature Layer)
  "features/sharding/":
    doc: "modules/features/sharding.md"
    description: "数据分片，分库分表策略和算法"
    key_classes: ["ShardingRule", "ShardingAlgorithm", "ShardingValue"]

  "features/encrypt/":
    doc: "modules/features/encrypt.md"
    description: "数据加密，列级加密和密钥管理"
    key_classes: ["EncryptRule", "Encryptor", "EncryptColumn"]

  "features/readwrite-splitting/":
    doc: "modules/features/readwrite-splitting.md"
    description: "读写分离，主从路由和负载均衡"
    key_classes: ["ReadwriteSplittingRule", "LoadBalanceAlgorithm"]

  "features/mask/":
    doc: "modules/features/mask.md"
    description: "数据脱敏，隐私保护"
    key_classes: ["MaskRule", "MaskAlgorithm"]

  "features/shadow/":
    doc: "modules/features/shadow.md"
    description: "影子库，测试环境隔离"
    key_classes: ["ShadowRule"]

  "features/broadcast/":
    doc: "modules/features/broadcast.md"
    description: "广播表，全量同步"
    key_classes: ["BroadcastTableRule"]

  # 应用集成层 (Integration Layer)
  "jdbc/":
    doc: "modules/integration/jdbc.md"
    description: "JDBC驱动，轻量级Java框架"
    key_classes: ["ShardingSphereDataSource", "ShardingSphereConnection"]

  "proxy/":
    doc: "modules/integration/proxy.md"
    description: "Proxy服务器，独立部署的数据库代理"
    key_classes: ["ShardingSphereProxy", "ProxyContext"]

  "shardingsphere-distsql/":
    doc: "modules/integration/distsql.md"
    description: "DistSQL，分布式SQL控制台"
    key_classes: ["DistSQLExecutor"]

# ============================================
# 类名索引 (Class Name Index)
# AI系统可通过类名快速定位相关文档
# ============================================

class_index:
  # 路由相关
  "RouteEngine":
    doc: "modules/infra/route.md"
    description: "路由引擎接口"
    package: "infra.route"
    usage: "SQL路由核心接口，负责将SQL路由到目标数据源"
    example: "RouteEngine routeEngine = new StandardRouteEngine(); RouteResult result = routeEngine.route(context);"

  "RouteResult":
    doc: "modules/infra/route.md"
    description: "路由结果"
    package: "infra.route"

  # 分片相关
  "ShardingRule":
    doc: "modules/features/sharding.md"
    description: "分片规则"
    package: "features.sharding.api"
    usage: "定义分片策略和算法的核心接口"
    example: "ShardingRule rule = new ShardingRuleConfigurationBuilder().addTableRule(...).build();"

  "ShardingAlgorithm":
    doc: "modules/features/sharding.md"
    description: "分片算法接口"
    package: "features.sharding.api.sharding"

  # 加密相关
  "EncryptRule":
    doc: "modules/features/encrypt.md"
    description: "加密规则"
    package: "features.encrypt.api"

  "Encryptor":
    doc: "modules/features/encrypt.md"
    description: "加密算法接口"
    package: "features.encrypt.api"

  # 合并相关
  "MergeEngine":
    doc: "modules/infra/merge.md"
    description: "合并引擎接口"
    package: "infra.merge"

  "MergedResult":
    doc: "modules/infra/merge.md"
    description: "合并结果"
    package: "infra.merge"

  # 解析相关
  "SQLParserEngine":
    doc: "modules/infra/parser.md"
    description: "SQL解析引擎"
    package: "infra.parser"

  "SQLStatement":
    doc: "modules/infra/parser.md"
    description: "SQL语句抽象"
    package: "infra.parser"


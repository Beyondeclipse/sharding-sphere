# ============================================
# 问题诊断索引 (Problem Diagnosis Index)
# AI系统可通过问题现象定位相关文档
# ============================================

problem_index:
  # 路由问题
  "路由错误":
    symptoms:
      - "SQL路由到错误的数据源"
      - "分片算法计算结果不正确"
    possible_causes:
      - "分片规则配置错误"
      - "分片算法实现问题"
    docs:
      - path: "modules/infra/route.md"
        section: "路由策略"
      - path: "modules/features/sharding.md"
        section: "分片规则配置"

  "性能问题":
    symptoms:
      - "查询响应慢"
      - "内存占用高"
    possible_causes:
      - "未使用流式合并"
      - "路由结果未缓存"
    docs:
      - path: "modules/infra/merge.md"
        section: "流式合并"
      - path: "modules/infra/route.md"
        section: "路由缓存"

  "数据不一致":
    symptoms:
      - "读取数据不是最新"
      - "主从数据不一致"
    possible_causes:
      - "读写分离配置问题"
      - "主从复制延迟"
    docs:
      - path: "modules/features/readwrite-splitting.md"
        section: "主从同步"

